# Migrations run automatically at API startup. This file is for running Alembic by hand, e.g.:
#   cd backend && DATABASE_URL=... ../.venv/bin/alembic revision -m "describe change"
[alembic]
script_location = app/storage/alembic
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
