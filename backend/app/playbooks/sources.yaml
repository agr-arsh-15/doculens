# Trusted sources behind every market standard, benchmark range and legal reference in the playbooks.
# Tiers: official (statutes, regulators, courts), professional (recognised professional and standards
# bodies), law_firm (published guidance by established law firms), news (major business news).
# Every url must be https and its host must match a domain allowed for its tier.

allowed_domains:
  official:
    - eur-lex.europa.eu
    - edpb.europa.eu
    - commission.europa.eu
    - legislation.gov.uk
    - gov.uk
    - ico.org.uk
    - leginfo.legislature.ca.gov
    - oag.ca.gov
    - nysenate.gov
    - dol.gov
    - ftc.gov
    - hhs.gov
    - dataprivacyframework.gov
    - indiacode.nic.in
    - meity.gov.in
    - labour.gov.in
    - msme.gov.in
    - rbi.org.in
    - cert-in.org.in
    - sci.gov.in
  professional:
    - iso.org
    - aicpa-cima.com
    - shrm.org
    - americanbar.org
    - adr.org
    - law.cornell.edu
  law_firm:
    - nortonrosefulbright.com
    - mayerbrown.com
    - littler.co.uk
    - khaitanco.com
    - nishithdesai.com
    - dlapiper.com
    - leglobal.law
    - jsalaw.com
    - seyfarth.com
    - moritthock.com
    - connkavanaugh.com
    - faegredrinker.com
    - jdsupra.com
  news:
    - economictimes.com
    - timesofindia.indiatimes.com

# Hosts that block automated requests (bot protection returns 403/404/202 to scripts).
# The link checker reports these as warnings instead of failures.
bot_protected:
  - eur-lex.europa.eu
  - legislation.gov.uk
  - leginfo.legislature.ca.gov
  - nysenate.gov
  - dol.gov
  - ftc.gov
  - hhs.gov
  - iso.org
  - americanbar.org
  - indiacode.nic.in
  - jsalaw.com

