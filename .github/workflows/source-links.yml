name: Source links

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pydantic PyYAML httpx python-dotenv
      - name: Check every source URL
        working-directory: backend
        run: python scripts/check_source_links.py --report ../link-report.md
      - name: Open an issue when a source link is broken
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Broken source link(s) in sources.yaml" --body-file link-report.md --label sources || \
          gh issue create --title "Broken source link(s) in sources.yaml" --body-file link-report.md
