name: Keep alive

# The free Render web service sleeps after 15 minutes without traffic, and free Supabase projects pause after
# 7 days of inactivity. Pinging the API every 10 minutes (with a database query) keeps both awake. One always-on
# free service uses about 744 of Render's 750 free hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and touch the database
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 6); do
            curl -fsS --max-time 60 "${API_URL%/}/api/health?deep=1" >/dev/null && echo "API is up" && exit 0
            echo "API not ready yet (attempt $i), waiting for it to wake up..."
            sleep 20
          done
          exit 1
