name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests (TF-IDF, no LLM, isolated database)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright journeys (test sign-in mode)
        working-directory: frontend
        run: npx playwright test

  docker:
    needs: [backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t doculens-api backend
      - name: Start it and check health
        run: |
          docker run -d --name api -p 7860:7860 -e DISABLE_NEURAL_EMBEDDINGS=0 doculens-api
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7860/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  deploy-backend:
    needs: [e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync backend/ to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git clone --depth 1 "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          rsync -a --delete --exclude '.git' --exclude 'data/' --exclude 'tests/' --exclude 'eval/' \
            --exclude '__pycache__/' --exclude '.pytest_cache/' backend/ space/
          cp deploy/hf-space/README.md space/README.md
          cd space
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Space already up to date" && exit 0
          git commit -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push
