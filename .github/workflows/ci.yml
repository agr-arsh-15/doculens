name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests (TF-IDF, no LLM, isolated database)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright journeys (test sign-in mode)
        working-directory: frontend
        run: npx playwright test

  docker:
    needs: [backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image with the Render settings (TF-IDF, rule-based lemmas)
        run: docker build --build-arg DISABLE_NEURAL_EMBEDDINGS=1 --build-arg LAB_USE_WORDNET=0 -t doculens-api backend
      - name: Run it inside Render's 512 MB limit and analyse a large real PDF
        run: |
          docker run -d --name api --memory=512m --memory-swap=512m -p 10000:10000 \
            -e ANALYSIS_WORKERS=1 -e LLM_PROVIDER=none doculens-api
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:10000/api/health >/dev/null && break; sleep 2; done
          doc=$(curl -fsS -F "file=@demo_documents/saas_contracts/gravity_bridgenet_saas_agreement.pdf;type=application/pdf" \
            http://127.0.0.1:10000/api/documents | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          aid=$(curl -fsS -H 'Content-Type: application/json' -d "{\"document_id\": \"$doc\", \"use_llm\": false}" \
            http://127.0.0.1:10000/api/analyses | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 90); do
            status=$(curl -fsS http://127.0.0.1:10000/api/analyses/$aid/status | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            [ "$status" = completed ] && break
            [ "$status" = failed ] && { docker logs api; exit 1; }
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:10000/api/analyses/$aid/report.pdf
          curl -fsS -o /dev/null http://127.0.0.1:10000/api/analyses/$aid/lab
          docker stats --no-stream --format 'Memory after analysis, PDF and Lab: {{.MemUsage}}' api
          [ "$(docker inspect -f '{{.State.OOMKilled}}' api)" = false ] || { echo "Out of memory"; exit 1; }
